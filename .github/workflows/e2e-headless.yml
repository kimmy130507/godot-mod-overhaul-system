name: E2E Headless GUI (simulated)

on:
  push:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

jobs:
  e2e-headless:
    name: Headless E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.x"]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Xvfb on linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml','**/requirements-dev.txt') }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest; fi

      - name: Run headless E2E tests
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a pytest tests/test_e2e_headless.py -q
          else
            pytest tests/test_e2e_headless.py -q
          fi
        shell: bash
