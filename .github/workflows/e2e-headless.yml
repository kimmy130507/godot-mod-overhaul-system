name: E2E Headless GUI (simulated)

on:
  push:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:

jobs:
  e2e-headless:
    name: Headless E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.x"]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      - name: Install system deps (Xvfb on linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Compute dependency hash
        id: dep-hash
        shell: python
        run: |
          import hashlib, os
          
          # Files to hash
          files = ['pyproject.toml', 'requirements-dev.txt']
          hasher = hashlib.sha256()
          
          for fn in files:
              if os.path.exists(fn):
                  with open(fn, 'rb') as f:
                      hasher.update(f.read())
          
          digest = hasher.hexdigest()
          # Write to GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"hash={digest}\n")

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ steps.dep-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-pip-
              
      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest
          fi
      - name: Run headless E2E tests
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a pytest tests/core/test_patcher_ops.py -q
          else
            pytest tests/core/test_patcher_ops.py -q
          fi
        shell: bash
