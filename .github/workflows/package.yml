name: Package GMOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --- Job 1: Build Binaries (EXE/ELF/App) ---
  package-binaries:
    name: Build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"] # Pinned for stability
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      # Compute hash via Python to bypass "hashFiles" template errors on macOS
      - name: Compute dependency hash
        id: dep-hash
        shell: python
        run: |
          import hashlib, os
          
          # Files to hash
          files = ['pyproject.toml', 'requirements-dev.txt']
          hasher = hashlib.sha256()
          
          for fn in files:
              if os.path.exists(fn):
                  print(f"Hashing {fn}...")
                  with open(fn, 'rb') as f:
                      hasher.update(f.read())
              else:
                  print(f"Skipping {fn} (not found)")
          
          digest = hasher.hexdigest()
          print(f"Computed hash: {digest}")
          
          # Write to GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"hash={digest}\n")

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # Use the computed hash from the previous step
          key: ${{ runner.os }}-pip-${{ steps.dep-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install .
          pip install pyinstaller
        shell: bash

      # --- Icon Generation Steps ---
      
      - name: Install image tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape imagemagick icnsutils librsvg2-bin
        shell: bash

      - name: Install image tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install --quiet inkscape imagemagick create-dmg || true
        shell: bash

      - name: Install image tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y inkscape imagemagick || Write-Host "choco install may have failed or already installed."

      - name: Export PNGs from SVG (all OS)
        run: |
          mkdir -p gmos/assets/icons
          echo "Exporting PNG sizes from SVG..."
          sizes=(1024 512 256 128 64 48 32 24 16)
          for s in "${sizes[@]}"; do
            inkscape gmos/assets/gmos.svg --export-type=png --export-filename=gmos/assets/icons/icon-${s}.png --export-width=${s} --export-height=${s}
          done
        shell: bash

      - name: Build .ico (Linux)
        if: runner.os == 'Linux'
        run: |
          convert \
            gmos/assets/icons/icon-256.png \
            gmos/assets/icons/icon-128.png \
            gmos/assets/icons/icon-64.png \
            gmos/assets/icons/icon-48.png \
            gmos/assets/icons/icon-32.png \
            gmos/assets/icons/icon-24.png \
            gmos/assets/icons/icon-16.png \
            gmos/assets/gmos.ico
        shell: bash

      - name: Build .ico (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $magick = (Get-Command magick -ErrorAction SilentlyContinue)
          if ($null -eq $magick) { Write-Error "ImageMagick 'magick' not found"; exit 1 }
          magick `
            gmos/assets/icons/icon-256.png `
            gmos/assets/icons/icon-128.png `
            gmos/assets/icons/icon-64.png `
            gmos/assets/icons/icon-48.png `
            gmos/assets/icons/icon-32.png `
            gmos/assets/icons/icon-24.png `
            gmos/assets/icons/icon-16.png `
            gmos\\assets\\gmos.ico

      - name: Build .icns (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          rm -rf MyIcon.iconset || true
          mkdir -p MyIcon.iconset
          cp gmos/assets/icons/icon-16.png  MyIcon.iconset/icon_16x16.png
          cp gmos/assets/icons/icon-32.png  MyIcon.iconset/icon_16x16@2x.png
          cp gmos/assets/icons/icon-32.png  MyIcon.iconset/icon_32x32.png
          cp gmos/assets/icons/icon-64.png  MyIcon.iconset/icon_32x32@2x.png
          cp gmos/assets/icons/icon-128.png MyIcon.iconset/icon_128x128.png
          cp gmos/assets/icons/icon-256.png MyIcon.iconset/icon_128x128@2x.png
          cp gmos/assets/icons/icon-256.png MyIcon.iconset/icon_256x256.png
          cp gmos/assets/icons/icon-512.png MyIcon.iconset/icon_256x256@2x.png
          cp gmos/assets/icons/icon-512.png MyIcon.iconset/icon_512x512.png
          cp gmos/assets/icons/icon-1024.png MyIcon.iconset/icon_512x512@2x.png
          iconutil -c icns MyIcon.iconset -o gmos/assets/gmos.icns
          rm -rf MyIcon.iconset
        shell: bash

      # --- Build & Packaging ---

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm gmos.spec
          cp LICENSE dist/
        shell: bash

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          # 1. Create a clean staging directory for the DMG content
          mkdir -p dist/dmg-source
          
          # 2. Move the App Bundle to staging (so we don't include the raw binary or other junk)
          mv "dist/GMOS.app" "dist/dmg-source/"
          cp LICENSE "dist/dmg-source/"
          
          # 3. Run create-dmg pointing to the staging folder
          create-dmg \
            --volname "GMOS Installer" \
            --volicon "gmos/assets/gmos.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --app-drop-link 400 190 \
            --icon "GMOS.app" 150 190 \
            --hide-extension "GMOS.app" \
            "dist/GMOS-Installer.dmg" \
            "dist/dmg-source/"
        shell: bash
        
      # --- GPG Signing ---

      - name: Create SHA256 Checksum and GPG Sign (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GPG_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY_B64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # 1. Checksum
          $exe = "dist\GMOS.exe"
          $hash = Get-FileHash -Path $exe -Algorithm SHA256
          $line = "{0}  {1}" -f $hash.Hash, (Split-Path $exe -Leaf)
          $line | Out-File -FilePath dist\GMOS.exe.sha256 -Encoding ascii

          # 2. Import Key
          $keyPath = "privkey.asc"
          [System.IO.File]::WriteAllBytes($keyPath, [System.Convert]::FromBase64String($Env:GPG_KEY_B64))
          gpg --batch --import $keyPath
          Remove-Item -Path $keyPath -Force

          # 3. Sign
          $sig = "dist\GMOS.exe.sig.asc"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$env:GPG_PASSPHRASE" --armor --output $sig --detach-sign $exe
          
          # 4. Verification
          gpg --verify $sig $exe
          Write-Host "Windows signature and checksum complete."

      - name: GPG Sign Executable (Linux)
        # Only runs for Linux, signing the bare executable
        if: runner.os == 'Linux'
        run: |
          set -e
          # 1. Prepare Key
          echo "${{ secrets.GPG_PRIVATE_KEY_B64 }}" | base64 --decode > privkey.asc
          
          # 2. Import Key
          gpg --batch --import privkey.asc
          
          # 3. Define the Executable Path
          EXE_PATH="dist/GMOS"

          # 4. Create Checksum
          shasum -a 256 "$EXE_PATH" > "${EXE_PATH}.sha256"

          # 5. Sign the executable
          echo '${{ secrets.GPG_PASSPHRASE }}' | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --output "${EXE_PATH}.sig.asc" --detach-sign "${EXE_PATH}"
          
          # 6. Verification and Cleanup
          gpg --verify "${EXE_PATH}.sig.asc" "${EXE_PATH}"
          rm privkey.asc
        shell: bash
        
      - name: GPG Sign DMG (macOS)
        # Runs only for macOS, signing the DMG file
        if: runner.os == 'macOS'
        run: |
          set -e
          # 1. Define the DMG Path
          DMG_PATH="dist/GMOS-Installer.dmg"

          # 2. Prepare Key
          echo "${{ secrets.GPG_PRIVATE_KEY_B64 }}" | base64 --decode > privkey.asc
          
          # 3. Import Key
          gpg --batch --import privkey.asc
          
          # 4. Create Checksum for the DMG
          shasum -a 256 "$DMG_PATH" > "${DMG_PATH}.sha256"

          # 5. Sign the DMG
          echo '${{ secrets.GPG_PASSPHRASE }}' | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --output "${DMG_PATH}.sig.asc" --detach-sign "${DMG_PATH}"
          
          # 6. Verification and Cleanup
          gpg --verify "${DMG_PATH}.sig.asc" "${DMG_PATH}"
          rm privkey.asc
        shell: bash

      - name: Upload Linux/Windows Artifact
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          # Normalize 'ubuntu-latest' to 'linux-latest' for the artifact name
          # and uses the original OS name for others (e.g., 'GMOS-windows-latest')
          name: ${{ contains(matrix.os, 'ubuntu') && 'GMOS-linux-latest' || format('GMOS-{0}', matrix.os) }}
          # Tell GitHub to zip the contents of the 'dist' directory
          path: dist/

      - name: Upload macOS Artifact (DMG Only)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: GMOS-macos-latest
          path: |
            dist/GMOS-Installer.dmg
            dist/GMOS-Installer.dmg.sha256
            dist/GMOS-Installer.dmg.sig.asc

  # --- Job 2: Build Python Source & Wheel ---
  build-python-dist:
    name: Build Python Dist (sdist/wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Upload Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gmos-pypi-dist
          path: dist/*