name: Package GMOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Build and publish binary (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.x]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml','**/requirements-dev.txt') }}

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Build with PyInstaller (using spec at repo root)
        run: |
          pyinstaller --clean --noconfirm gmos.spec

      - name: Package artifact on Linux / macOS
        if: runner.os != 'Windows'
        id: package_artifact
        run: |
          ART="gmos-${{ matrix.os }}-${{ github.run_number }}.zip"
          zip -r "$ART" dist/*
          echo "artifact=$ART" >> $GITHUB_OUTPUT

      - name: Package artifact on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $art = "gmos-${{ matrix.os }}-${{ github.run_number }}.zip"
          Compress-Archive -Path dist\* -DestinationPath $art -Force
          echo "artifact=$art" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmos-${{ matrix.os }}-${{ github.run_number }}
          path: ${{ steps.package_artifact.outputs.artifact || format('gmos-{0}-{1}.zip', matrix.os, github.run_number) }}
