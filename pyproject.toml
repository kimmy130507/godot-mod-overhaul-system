[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godot-mod-overhaul-system"
version = "1.0"
description = "Cross-platform external mod loader and patcher for Godot games."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Kim", email = "kimmy130507@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/kimmy130507/godot-mod-overhaul-system"
"Repository" = "https://github.com/kimmy130507/godot-mod-overhaul-system"

[project.scripts]
godot-mod-loader = "mod_loader:main"
